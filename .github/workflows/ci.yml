name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: gitleaks detect --source . --redact -v
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Require pull requests to target the default branch
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$PR_BASE" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Pull requests must target '$DEFAULT_BRANCH' (got '$PR_BASE')."
            exit 1
          fi
      - name: Require pull request review and fail-first evidence
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_evidence.py
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Check project documentation
        env:
          DOCS_BASE_REF: origin/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: make docs-check
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t app:ci .
  docs-updated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: infra changes need ARCHITECTURE or RUNBOOK updates
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -qE '^\.github/workflows/deploy'; then
            echo "$changed" | grep -qE '^\.trazo/ARCHITECTURE\.md$|^\.trazo/project/RUNBOOK\.md$' \
              || { echo "::error::deploy changed without .trazo/ARCHITECTURE.md or .trazo/project/RUNBOOK.md"; exit 1; }
          fi
