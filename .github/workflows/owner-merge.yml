name: owner-merge
# Owner-triggered merge for any pull request, not only drive's issue-* branches (issue #321).
#
# Why: an agent session may not run `gh pr merge` (the shipped settings.json denies it), and drive.yml
# merges only issue-* branches that touch no owner-protected path. This is the one path for everything
# else: the owner or the front door starts it (agents may dispatch it; settings.json denies every other
# workflow dispatch), and it still refuses unless this exact head has passed every gate.
#
#   gh workflow run owner-merge.yml -f pr=123        (or "Run workflow" on the Actions tab)
#
# It merges only when, at the head commit read at the start:
#   - the pull request is open, not a draft, not from a fork, and targets the default branch
#   - every check run on it is success or skipped (CI green)
#   - if it changes a risky path (ADR 0031: the classifier shared with review.yml and drive.yml, plus all
#     of src/ and .trazo/ outside project/, which the ADR lists and the classifier prefixes do not all
#     reach), trazo/verdict AND trazo/security are success on that head: the owner starting this run is
#     the owner review CODEOWNERS asks for
#   - if it changes only non-risky paths (docs, STATUS, PLAN, workstreams, reports), no reviewer status is
#     needed: this dispatch is the Coordinator's check of the diff and CI (ADR 0031). A reviewer status
#     of failure or pending on that head still refuses. A diff touching both kinds is risky, and so is a
#     rename out of a risky path (both names are classified).
# The shared-account identity gap is NOT closed by this (#366): the reviewer and security statuses are
# set by the account that dispatches and by the agents it runs, so this gate cannot tell them apart.
# and it merges with --match-head-commit, so a push after the check cannot slip in. Any error refuses.
#
# Only the repository owner's dispatch runs, from the default branch, so a pull request cannot edit the
# script it is judged by. UNVERIFIED on a live run: that github.token may squash-merge a pull request that
# edits files under .github/workflows/ (GitHub restricts that token's workflow-file writes). If it cannot,
# the owner merges that one pull request with `gh pr merge`.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to merge
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owner-merge
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      checks: read
      issues: read
    steps:
      # The default branch supplies .github/CODEOWNERS and scripts/report_verdict.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: merge the pull request if its gates have passed at its current head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::PR #${PR}: $1; not merging."; exit 1; }
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a pull request number"; exit 1; }
          IFS=$'\t' read -r state draft cross base sha <<<"$(gh pr view "$PR" \
            --json state,isDraft,isCrossRepository,baseRefName,headRefOid \
            -q '[.state, (.isDraft | tostring), (.isCrossRepository | tostring), .baseRefName, .headRefOid] | @tsv')"
          [[ "$state" == "OPEN" ]] || refuse "state is ${state:-unknown}"
          [[ "$draft" == "false" ]] || refuse "it is a draft"
          [[ "$cross" == "false" ]] || refuse "it comes from a fork"
          [[ "$base" == "$DEFAULT_BRANCH" ]] || refuse "its base is ${base:-unknown}, not ${DEFAULT_BRANCH}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || refuse "no head commit was found"
          # One classifier, shared with review.yml and drive.yml: it sees both sides of a rename and fails
          # closed on a short listing.
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" -q '.changed_files')
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            -q '.[] | [.filename, (.previous_filename // "")] | @tsv')
          sensitive=$(CHANGED_FILES="$changed" python3 scripts/report_verdict.py --sensitive .github/CODEOWNERS <<<"$files")
          # ADR 0031 also names all of src/ and .trazo/ outside project/ as risky; either name of a rename counts.
          extra=$(tr '\t' '\n' <<<"$files" | { grep -iE '^(src/|\.trazo/)' || true; } | { grep -viE '^\.trazo/project/' || true; })
          if [[ -n "$extra" ]]; then sensitive=sensitive=true; fi
          status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status?per_page=100")
          verdict=$(jq -r '[.statuses[] | select(.context == "trazo/verdict")][0].state // ""' <<<"$status")
          security=$(jq -r '[.statuses[] | select(.context == "trazo/security")][0].state // "none"' <<<"$status")
          # Only the latest run of each check name counts (highest id): a re-run on the same sha leaves its old
          # failed or cancelled runs in the list. A latest run still in progress has no conclusion: pending.
          runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            -q '.check_runs[] | [.name, (.id | tostring), (.conclusion // "pending")] | @tsv' \
            | sort -t "$(printf '\t')" -k1,1 -k2,2n \
            | awk -F '\t' '{ latest[$1] = $3 } END { for (name in latest) print latest[name] }')
          if [[ -n "$runs" ]] && ! grep -qvxE 'success|skipped' <<<"$runs"; then ci=success; else ci=pending; fi
          [[ "$ci" == "success" ]] || refuse "the checks are not all green on this head"
          case "$sensitive" in
            sensitive=false)
              # Non-risky only: the dispatch is the Coordinator's check. A recorded reviewer objection stands.
              [[ -z "$verdict" || "$verdict" == "success" ]] || refuse "trazo/verdict is ${verdict} on this head"
              [[ "$security" == "none" || "$security" == "success" ]] || refuse "trazo/security is ${security} on this head" ;;
            sensitive=true)
              [[ "$verdict" == "success" ]] || refuse "it changes risky paths and trazo/verdict is ${verdict:-missing} on this head"
              [[ "$security" == "success" ]] || refuse "it changes owner-protected paths and trazo/security is ${security} on this head" ;;
            *) refuse "the changed files could not be classified" ;;
          esac
          gh pr merge "$PR" --squash --match-head-commit "$sha"
          echo "Merged PR #${PR} at ${sha}."
