name: merge-audit
# Scheduled audit (#380, ADR 0031): re-apply the owner-merge.yml gate to recently merged pull requests and open
# an issue naming any that did not meet it (a direct merge, a red check, a risky diff with no verdict or
# security status). Detection only: it reverts and merges nothing. Logic and tests: scripts/audit_merges.py.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: audit merges against the gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/audit_merges.py
