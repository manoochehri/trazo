name: ci
# Installed by Trazo. The secrets scan, the PR evidence check and the docs-updated check are
# stack-neutral. The test command and the Dockerfile are your stack's, so they are placeholders
# that fail loudly until /kickoff asks how this project is built and tested and replaces them.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: gitleaks detect --source . --redact -v
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require pull requests to target the default branch
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$PR_BASE" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Pull requests must target '$DEFAULT_BRANCH' (got '$PR_BASE')."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require pull request review and fail-first evidence
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pr_evidence.py
      # PLACEHOLDER. Replace this step with your test command (and the setup it needs).
      - name: test command (not set)
        run: |
          echo "::error::The test command is not set. Run /kickoff: it asks how this project is built and tested and replaces this step."
          exit 1
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Dockerfile Trazo placed is a placeholder that fails; /kickoff replaces it.
      - run: docker build -t app:ci .
  docs-updated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: infra changes need ARCHITECTURE or RUNBOOK updates
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -qE '^\.github/workflows/deploy'; then
            echo "$changed" | grep -qE '^\.trazo/ARCHITECTURE\.md$|^\.trazo/project/RUNBOOK\.md$' \
              || { echo "::error::deploy changed without .trazo/ARCHITECTURE.md or .trazo/project/RUNBOOK.md"; exit 1; }
          fi
