name: status
# Manual only (issue #328, step 1): prints the generated STATUS block and uploads it as an
# artifact. It writes nothing to the repository.
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: generate the STATUS block
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRIVE_ENABLED: ${{ vars.DRIVE_ENABLED }}
        run: python3 scripts/gen_status.py | tee "$RUNNER_TEMP/status-block.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-block
          path: ${{ runner.temp }}/status-block.md
