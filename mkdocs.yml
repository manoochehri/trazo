site_name: Trazo
site_description: A governance overlay for AI coding agents. Mount it on any repo — new or existing — and agents start working to rules instead of improvising.
site_url: https://manoochehri.github.io/trazo/
repo_url: https://github.com/manoochehri/trazo
repo_name: manoochehri/trazo
edit_uri: edit/main/handbook/
docs_dir: handbook

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - What is .trazo/: overlay.md
  - AGENTS.md and Trazo: agents.md
  - Install: install.md
  - Playbook: playbook.md
  - Guide: guide.md
  - The team: team.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

# `mkdocs build --strict` turns validation.links.not_found (default: warn)
# into a hard failure, so broken internal links fail CI.
